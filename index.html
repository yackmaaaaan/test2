<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>麻雀牌 写真認識テスト</title><link rel="stylesheet" href="style.css"></head><body><header>麻雀牌 写真認識テスト</header><main><section class="card"><h1>HaseLab 2段階認識テスト</h1><p class="sub">Tile YOLOで牌を検出し、切り出した牌をResNet-50で個別分類します。</p><div class="buttons"><label class="btn">写真を選択<input id="file" type="file" accept="image/*" hidden></label><button id="run" class="btn" disabled>認識する</button></div><div id="status">モデル未読込</div><img id="preview" alt="選択画像"></section><section class="card"><h2>検出結果 <span id="count"></span></h2><div id="tiles" class="tiles"></div></section><section class="card"><h2>ログ</h2><pre id="log"></pre></section></main><script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/ort.min.js"></script><script src="app.js"></script></body></html>
